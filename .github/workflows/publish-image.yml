name: Publish image

# Builds the same image as upstream "Build Containers" (Dockerfile.dev) and
# publishes it for this fork. Upstream pushes ghcr.io/gitroomhq/postiz-app on
# tags, for amd64 and arm64. This workflow publishes
# ghcr.io/marsbasealpha-bot/postiz-app on main, linux/amd64 only.
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Default GITHUB_TOKEN is read-only in many repos. packages:write is what
# lets this job push to GHCR. The token is scoped to this repository.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'marsbasealpha-bot/postiz-app'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/marsbasealpha-bot/postiz-app
        run: |
          short="${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${short}" \
            --build-arg NEXT_PUBLIC_VERSION="${short}" \
            --pull \
            --provenance=false --sbom=false \
            --push .

      - name: Verify image
        env:
          IMAGE: ghcr.io/marsbasealpha-bot/postiz-app
        run: |
          short="${GITHUB_SHA::7}"
          docker buildx imagetools inspect "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${short}"
